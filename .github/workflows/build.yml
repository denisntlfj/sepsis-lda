name: Build Windows App with PyInstaller

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Кэширование ускорит последующие сборки

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install streamlit pyinstaller pywebview pandas joblib scikit-learn jinja2

    - name: Run PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --copy-metadata streamlit --add-data "ui.py;." --add-data "qda.py;." --add-data "sepsis_data.csv;." --add-data "qda_model.pkl;." --add-data "scaler.pkl;." run_app.py

    - name: Archive production artifacts
      shell: bash
      run: |
        cd dist
        tar -a -c -f ../Sepsis_Diagnostic_System_Windows.zip run_app/

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sepsis_Diagnostic_System_Windows
        path: Sepsis_Diagnostic_System_Windows.zip
        retention-days: 5 # Сборка будет храниться в GitHub 5 дней
